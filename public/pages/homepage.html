<!DOCTYPE html>
<html>
    <head>
        <title>Theatrical Indie Showcase</title>
        <meta name="description" content="The homepage for the theatrical indie showcase site.">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">   
        <!-- <link rel="stylesheet" href="../styles/index.css"> -->
        <link rel="stylesheet" href="../styles/homepage.css">
        <script type="module" src="../app.js" defer></script>
    </head>
    <body>
        <header>
            <p id="logo-text">THEATRICAL INDIE SHOWCASE</p>
        </header>
        <section id="banner">
            <!-- display text through app.js instead -->
            <div id="username"></div>
            <button id="sign-out-button">Sign Out</button>
        </section>
        <main>
            <h1>Theatrical Indie Productions (2025-2026)</h1>
            <h2>Animated Films</h2>
            <section id="animated-film-thumbnails">
                <img class="thumbnail" src="../images/flow.webp" alt="&quot;Flow&quot; movie poster">
                <img class="thumbnail" src="../images/memoir-of-a-snail.webp" alt="&quot;Memoir of a Snail&quot; movie poster">
                <img class="thumbnail" src="../images/arco.webp" alt="&quot;Arco&quot; movie poster">
                <img class="thumbnail" src="../images/bfdi.webp" alt="&quot;Battle for Dream Island&quot; movie poster">
                <img class="thumbnail" src="../images/tadc.webp" alt="&quot;The Amazing Digital Circus: The Last Act&quot; movie poster">
            </section>
            <h2>Live Action Films</h2>
            <section id="live-action-film-thumbnails">
                <img class="thumbnail" src="../images/anora.webp" alt="&quot;Anora&quot; movie poster">
                <img class="thumbnail" src="../images/the-substance.webp" alt="&quot;The Substance&quot; movie poster">
                <img class="thumbnail" src="../images/the-brutalist.webp" alt="&quot;The Brutalist&quot; movie poster">
                <img class="thumbnail" src="../images/iron-lung.webp" alt="&quot;Iron Lung&quot; movie poster">
            </section>
        </main>
    </body>
</html>
