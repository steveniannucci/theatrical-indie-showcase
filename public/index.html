<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="The login page for the theatrical indie showcase site.">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Theatrical Indie Showcase</title>
        <link rel="stylesheet" href="styles/index.css">
        <script type="module" src="./app.js" defer></script>
    </head>
    <body>
        <header>
            <p id="logo-text">THEATRICAL INDIE SHOWCASE</p>
        </header>
        <main>
            <h1>Log In</h1>
            <section id="login-section">
                <form id="login-form">
                    <div id="login-error" class="error-message"></div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="user@gmail.com" autocomplete="email">
                    <div id="email-error" class="error-message"></div>
                    <label for="password">Password</label>
                    <div class="show-password">
                        <input type="password" id="password" name="password" placeholder="passWord0!">
                        <button type="button" id="show-password-button" role="switch" tabindex="0" aria-checked="false"></button>
                    </div>
                    <div id="password-error" class="error-message"></div>
                    <!-- <p id="forgot-password-link"><a href="#">Forgot your password?</a></p> -->
                    <button type="button" id="login-button">Log in</button>
                </form>
                <p class="horizontal-line"><span>or</span></p>
                <button id="sign-in-with-Google-button">Sign in with Google</button>
                <p>Need an account? <a href="pages/signup.html">Sign up</a></p>
            </section>
        </main>
    </body>
</html>
